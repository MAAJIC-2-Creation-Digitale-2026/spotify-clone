<body class="page">

  <header class="page-haut">
    <div data-include="components/barre-haut.html"></div>
  </header>

  <main class="page-contenu">
    <div data-include="components/rangee.html" data-titre="Conçu pour toi">
      <div data-include="components/carte.html" data-titre="Découvertes de la semaine" data-texte="De nouveaux titres choisis pour toi, chaque lundi." data-image="assets/img/pochettes/decouvertes.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Focus devoirs" data-texte="De la musique sans paroles pour se concentrer." data-image="assets/img/pochettes/focus-devoirs.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Daily Mix 1" data-texte="Lova Kaz, Piton Club, Saphir Nwar et plus encore." data-image="assets/img/pochettes/daily-mix-1.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Daily Mix 2" data-texte="Les Tamarins, Isaure Delmas, Velours Mécanique et plus encore." data-image="assets/img/pochettes/daily-mix-2.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Radar des sorties" data-texte="Les nouveautés de tes artistes, chaque vendredi." data-image="assets/img/pochettes/radar-des-sorties.jpg" data-lien="playlist.html"></div>
    </div>

    <section>
      <h2 class="page-titre-section">Lancer la lecture</h2>
      <div class="page-liste">
        <div data-include="components/ligne-titre.html" data-titre="Ti lampé" data-artiste="Lova Kaz" data-image="assets/img/pochettes/kabar-la-nuit.jpg" data-piste="0"></div>
        <div data-include="components/ligne-titre.html" data-titre="Bleu piscine" data-artiste="Nayla Rivière" data-image="assets/img/pochettes/bleu-piscine.jpg" data-piste="1"></div>
        <div data-include="components/ligne-titre.html" data-titre="Coulée" data-artiste="Piton Club" data-image="assets/img/pochettes/basalte.jpg" data-piste="2"></div>
      </div>
    </section>

    <div data-include="components/rangee.html" data-titre="Tes playlists">
      <div data-include="components/carte.html" data-titre="Titres likés" data-texte="Tous les titres que tu as aimés." data-image="assets/img/pochettes/titres-likes.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Chill du dimanche" data-texte="Des titres calmes pour finir la semaine." data-image="assets/img/pochettes/chill-du-dimanche.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Maloya &amp; co" data-texte="Le maloya d'aujourd'hui, du kayamb aux synthés." data-image="assets/img/pochettes/maloya-and-co.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Road trip côte Est" data-texte="À écouter fenêtres ouvertes, de Saint-Benoît à Saint-Philippe." data-image="assets/img/pochettes/road-trip.jpg" data-lien="playlist.html"></div>
      <div data-include="components/carte.html" data-titre="Soirée rooftop" data-texte="Pop et R&amp;B pour danser au coucher du soleil." data-image="assets/img/pochettes/soiree-rooftop.jpg" data-lien="playlist.html"></div>
    </div>

    <div data-include="components/rangee.html" data-titre="Artistes populaires">
      <div data-include="components/carte-artiste.html" data-nom="Lova Kaz" data-image="assets/img/artistes/lova-kaz.jpg" data-lien="#"></div>
      <div data-include="components/carte-artiste.html" data-nom="Nayla Rivière" data-image="assets/img/artistes/nayla-riviere.jpg" data-lien="#"></div>
      <div data-include="components/carte-artiste.html" data-nom="Piton Club" data-image="assets/img/artistes/piton-club.jpg" data-lien="#"></div>
      <div data-include="components/carte-artiste.html" data-nom="Les Tamarins" data-image="assets/img/artistes/les-tamarins.jpg" data-lien="#"></div>
      <div data-include="components/carte-artiste.html" data-nom="Saphir Nwar" data-image="assets/img/artistes/saphir-nwar.jpg" data-lien="#"></div>
      <div data-include="components/carte-artiste.html" data-nom="Velours Mécanique" data-image="assets/img/artistes/velours-mecanique.jpg" data-lien="#"></div>
    </div>
  </main>

  <div class="page-bas">
    <div data-include="components/mini-lecteur.html"></div>
    <div data-include="components/nav-bas.html" data-actif="accueil"></div>
  </div>

  <!-- Le menu du profil (ticket #8) : caché, il s'ouvre avec l'avatar -->
  <div data-include="components/menu-profil.html"></div>

  <script src="js/include.js" defer></script>
  <script src="js/player.js" defer></script>

</html>
