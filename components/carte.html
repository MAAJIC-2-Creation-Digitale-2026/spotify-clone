  COMPOSANT : carte · ticket T03 · Carte de playlist
  Maquette : telephone/02-accueil-page-entiere.png (« Conçu pour… », « Douillet »)

  Trous à remplir par la page :
    {{image}}  chemin de la pochette     {{titre}}  nom de la playlist
    {{texte}}  description (2 lignes)    {{lien}}   page où mène la carte

  À FAIRE : à l'intérieur de <a class="carte">
    <img class="carte-image" src="{{image}}" alt="">

<a class="carte" href="{{lien}}">
  <div class="carte__pochette">

    <h3 class="carte__titre">{{titre}}</h3> 
  </div>
  <p class="carte__texte">{{texte}}</p>
