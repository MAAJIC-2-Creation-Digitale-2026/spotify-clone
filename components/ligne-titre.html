<!--
  COMPOSANT : ligne-titre · ticket T06 · Une ligne de la liste des titres
  Maquette : telephone/02-accueil-page-entiere.png (« Lancer la lecture »)

  Trous : {{image}} pochette · {{titre}} titre du morceau · {{artiste}} artiste
          {{piste}} numéro de piste du lecteur (0, 1, 2…) : un clic lance le morceau

  À FAIRE : à l'intérieur de <div class="ligne-titre">
    <img class="ligne-titre-image" src="{{image}}" alt="">
    <div class="ligne-titre-textes">
      <p class="ligne-titre-titre">{{titre}}</p>
      <p class="ligne-titre-artiste">{{artiste}}</p>
    </div>
    <button class="ligne-titre-plus" aria-label="Plus d'options"><i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i></button>
-->
<div class="ligne-titre" data-piste="{{piste}}">
  <div class="ligne-titre-image-container">
    <img class="ligne-titre-image" src="https://i.scdn.co/image/ab6761610000101fc1719ac9e6a75c1c25835018" alt="">
    <div class="ligne-titre-textes">
      <p class="ligne-titre-titre">{{titre}}</p>
      <p class="ligne-titre-artiste">{{artiste}}</p>
    </div>
  </div>
<button class="ligne-titre-plus" aria-label="Plus d'options"><i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i></button>
