<!--
  COMPOSANT : playlist-actions · ticket T13 · La barre de boutons sous l'en-tête de la playlist
  Maquette : la page d'une playlist dans l'appli

  À FAIRE : à l'intérieur de <div class="playlist-actions">
    à gauche (dans un <div>) : 3 boutons-icônes gris avec aria-label :
       ajouter (fa-solid fa-circle-plus) · télécharger (fa-solid fa-circle-down) · options (fa-solid fa-ellipsis-vertical)
    à droite (dans un <div>) : lecture aléatoire (fa-solid fa-shuffle)
       + le GROS bouton play vert : <button class="playlist-actions-play" data-piste="0" aria-label="Lecture">
-->
<div class="playlist-actions">
  <!-- ton HTML ici -->
  <div class="playlist-left">
    <button class="btn-icone" aria-label="Ajouter">
      <i class="fas fa-circle-plus"></i>
    </button>
    <button class="btn-icone" aria-label="Télécharger">
      <i class="fas fa-circle-down"></i>
    </button>
    <button class="btn-icone" aria-label="Options">
      <i class="fas fa-ellipsis-vertical"></i>
    </button>
  </div>
  <div class="playlist-right">
    <button class="btn-icone" aria-label="Lecture aléatoire">
      <i class="fas fa-shuffle"></i>
    </button>
    <button class="playlist-actions-play" data-piste="0" aria-label="Lecture">
      <i class="fas fa-play"></i>
    </button>
  </div>
</div>
