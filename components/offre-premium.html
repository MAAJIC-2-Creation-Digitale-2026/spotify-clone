<!--
  COMPOSANT : offre-premium · ticket T15 · Une carte d'offre de la page Premium
  Maquette : telephone/05-premium-page-entiere.png

  Trous : {{nom}} nom de l'offre · {{prix}} ex. « 10,99 € par mois » · {{couleur}} couleur du nom
          {{avantages}} : non, les avantages sont écrits par la page entre les balises → {{contenu}}

  À FAIRE : à l'intérieur de <article class="offre-premium">
    une étiquette « Premium » (fa-brands fa-spotify) · <h2 class="offre-premium-nom">{{nom}}</h2>
    <p class="offre-premium-prix">{{prix}}</p>
    <ul class="offre-premium-avantages">{{contenu}}</ul>
    un bouton pilule <a class="offre-premium-bouton" href="#">Essayer</a>
-->
<article class="premium-card premium-plan" style="--couleur: {{couleur}}">
  <span class="premium-ribbon premium-ribbon--personnel">0 € pour 1 mois</span>
  <div class="premium-plan-header">
    <span class="premium-plan-brand"><i class="fa-brands fa-spotify"></i>Premium</span>
    <h2 class="offre-premium-nom text-personnel">{{nom}}</h2>
    <p class="offre-premium-prix">{{prix}}</p>
    <p class="premium-plan-subprice">12,14 €/mois ensuite</p>
  </div>
  <hr class="premium-divider">
    <ul class="offre-premium-avantages">{{contenu}}</ul>
    <button class="premium-cta premium-cta--personnel">Essayer pendant 1 mois pour 0 €</button>
    <p class="premium-legal center">
    0 € pour 1 mois, puis 12,14 €/mois. Offre réservée aux personnes n'ayant jamais essayé Spotify Premium. Soumis à conditions.
    </p>
</article>
