       (dans le site : le bouton avatar des composants barre-haut, recherche-entete et biblio-entete ;

<aside id="menu-profil" class="menu-profil" popover aria-label="Menu du profil">
  
  <section class="menu-profil__en-tete">
      <i class="fa-regular fa-user"></i>

      <div class="menu-profil__identite">
        <h2>Profil</h2>
        <h4>Voir le profil</h4>
    </div>
  </section>
  <hr>
  <div class="menu-profil__contenu">

    <nav>
      <div class="menu-profil__liste">
        <ul>
          <a href="#">
            <li><i class="fa-solid fa-circle-plus"></i>Ajouter un compte</li>
          </a>
          <a href="#">
            <li><i class="fa-solid fa-chart-line"></i>Stats d'écoute</li>
          </a>
          <a href="#">
            <li><i class="fa-regular fa-clock"></i>Récents</li>
          </a>
          <a href="#">
            <li><i class="fa-solid fa-bullhorn"></i>Votre fil d'actualités</li>
          </a>
          <a href="#">
            <li><i class="fa-solid fa-gear"></i>Préférences et confidentialité</li>
          </a>
        </ul>
      </div>
    </nav>

    <section class="menu-profil__contacts">
      <div class="menu-profil__activite">
        <i class="fa-regular fa-user"></i>
        <button type="button">Activité</button>
        <p>Activer</p>
      </div>
      
      <div class="menu-profil__ajouter-contacts">
        <i class="fa-solid fa-plus"></i>
        <p>Inviter des contacts</p>
      </div>
    </section>

    <section class="menu-profil__messages">
      <h2>Messages<i class="fa-solid fa-angle-right"></i></h2>
      <div>
        <i class="fa-solid fa-pen-to-square"></i>
      </div>
      <p>Partager vos coups de coeur,</p><p>directement sur Spotify.</p>
    </section>

    <section class="menu-profil__nouveau_message">
      <i class="fa-solid fa-pen-to-square"></i>
      <p>Nouveau message</p>
    </section>
  </div>
</aside>
