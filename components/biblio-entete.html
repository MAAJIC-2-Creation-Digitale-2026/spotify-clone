<!--
  COMPOSANT : biblio-entete · ticket T10 · Titre « Bibliothèque » + filtres + tri
  Maquette : telephone/04-bibliotheque-page-entiere.png (en haut)

  À FAIRE : à l'intérieur de <div class="biblio-entete">
    1. une ligne : avatar <button class="biblio-entete-avatar" popovertarget="menu-profil" aria-label="Ouvrir le menu du profil">A</button>
       (popovertarget ouvre le menu du profil, ticket #8)
       + <h1 class="biblio-entete-titre">Bibliothèque</h1>
       + à droite 2 boutons-icônes : loupe (fa-magnifying-glass) et plus (fa-plus), avec aria-label
    2. une ligne de filtres en pilules : <button class="biblio-entete-filtre"> Playlists · Artistes
    3. une ligne « Récents » : à gauche un bouton tri (fa-arrow-down-wide-short + « Récents »),
       à droite un bouton d'affichage en grille (fa-table-cells-large, aria-label="Afficher en grille")
-->




<div class="biblio-entete" >


   <div class="biblio-entete-ligne-une">
      <button class="biblio-entete-avatar" popovertarget="menu-profil" aria-label="Ouvrir le menu du profil"   aria-hidden="true">A</button>

      <h1 class="biblio-entete-titre">Bibliothèque</h1>
      <button class="biblio-entete-loupe" aria-label="Rechercher"> <i  aria-hidden="true" class="fa-solid fa-magnifying-glass"></i></button> 
      <button  class="biblio-entete-plus" aria-label="Créer"><i  aria-hidden="true" class="fa-solid fa-plus"></i></button> 

   </div>

   <div class="biblio-entete-ligne-deux">
      <button class="biblio-entete-filtre">Playlists</button>
      <button class="biblio-entete-filtre">Artistes</button>

   </div>


   <div class="biblio-entete-ligne-trois">

      <button class="biblio-entete-recents"  >
         <i aria-label="Récents" aria-hidden="true" class="fa-solid fa-sort"></i>
         <p>Récents</p>
      </button>

      <button aria-label="trier" ><i   aria-hidden="true"  class="fa-solid fa-border-all"></i> </button>
   </div>



</div>
