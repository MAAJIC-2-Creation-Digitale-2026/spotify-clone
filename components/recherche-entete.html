  COMPOSANT : recherche-entete · ticket T08 · Titre « Rechercher » + champ de recherche blanc
  Maquette : telephone/03-rechercher-page-entiere.png (en haut)

  À FAIRE : à l'intérieur de <div class="recherche-entete">
    1. une ligne avec l'avatar : <button class="recherche-entete-avatar" popovertarget="menu-profil" aria-label="Ouvrir le menu du profil">A</button>
       (popovertarget ouvre le menu du profil, ticket #8)

       + à droite un bouton appareil photo (fa-solid fa-camera, aria-label="Rechercher avec une photo")

<div class="recherche-entete">
  <!-- ton HTML ici -->
   
  <div class="recherche-entete-principal">
    <button class="recherche-entete-avatar" popovertarget="menu-profil" aria-label="Ouvrir le menu du profil">A</button>
    <h1 class="recherche-entete-titre">Rechercher</h1>
    <button class="recherche-entete-camera" aria-label="Rechercher avec une photo">
      <i class="fa-solid fa-camera recherche-entete-icone-camera" aria-hidden="true"></i>
    </button>
  </div>

  <form class="recherche-entete-form" role="search">
    <i class="fa-solid fa-magnifying-glass recherche-entete-loupe" aria-hidden="true"></i>
    <input type="search" class="recherche-entete-champ" placeholder="Que souhaitez-vous écouter ?" aria-label="Rechercher">
  </form>
</div>
