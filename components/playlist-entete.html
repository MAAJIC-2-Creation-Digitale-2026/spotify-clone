<!--
  COMPOSANT : playlist-entete · ticket T12 · Haut de la page playlist
  Maquette : la page d'une playlist dans l'appli (pochette centrée sur un fond en dégradé)

  Trous : {{image}} pochette · {{titre}} nom de la playlist · {{couleur}} couleur du dégradé
          {{createur}} qui l'a créée · {{infos}} ex. « 12 titres · 44 min »

  À FAIRE : à l'intérieur de <header class="playlist-entete">
    un bouton retour (fa-solid fa-arrow-left, aria-label="Retour") qui est un lien vers index.html
    <img class="playlist-entete-image" src="{{image}}" alt="">
    <h1 class="playlist-entete-titre">{{titre}}</h1>
    <p class="playlist-entete-createur">{{createur}}</p>
    <p class="playlist-entete-infos">{{infos}}</p>
  La variable --couleur est déjà posée par l'attribut style : sers-t'en dans le dégradé.
-->
<header class="playlist-entete" style="--couleur: {{couleur}}">
  <div class="playlist-entete__header">

    <img class="playlist-entete-image" src="https://i.scdn.co/image/ab6761610000101fc1719ac9e6a75c1c25835018" alt="Mix The Weeknd">
    <a href="index.html">
      <i class="fa-solid fa-chevron-left"></i>
    </a>
    
  </div>

  <div class="playlist-entete__infos">
    <p class="playlist__type">{{Playlist publique}}</p>
    <h1 class="playlist-entete-titre">{{titre}}</h1>
    <p class="playlist__artistes">{{Rihanna, Doja Cat et Future}}</p>
    <div class="playlist__auteur">
      <i class="fa-brands fa-spotify"></i>
      <span>Spotify</span>
      <span>· 50 titres, environ 3 h 15 min</span>
    </div>
    <p class="playlist__description">Recommandations et impact de la promotion</p>
  </div>
</header>

<section>

</section>
